name: Profile Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/profile_sync/**
      - scripts/sync_profile_assets.py
      - scripts/validate_portfolio_sync.py
      - .github/workflows/profile-sync.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh verified public repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_profile_assets.py
      - name: Validate synchronized profile
        run: python3 scripts/validate_portfolio_sync.py --offline
      - name: Commit changed metadata
        id: commit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/sync/account-summary.json assets/sync/public-repositories.json
          git commit -m "chore: sync verified public profile metadata"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild Pages with the changed snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
