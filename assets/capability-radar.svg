<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">CRYO capability radar</title><desc id="d">Visual capability score across engineering domains.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="640" rx="30" fill="#06090f"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="60" y="65" font-size="30" font-weight="800" fill="#f8fafc">CAPABILITY RADAR</text><text x="60" y="96" font-size="15" fill="#94a3b8">Observable portfolio signal · normalized / 100</text><g transform="translate(430 330)"><polygon points="0,-230 218,-71 135,185 -135,185 -218,-71" fill="#0b1220" stroke="#334155" stroke-width="2"/><polygon points="0,-180 170,-55 105,145 -105,145 -170,-55" fill="none" stroke="#334155"/><polygon points="0,-120 113,-37 70,97 -70,97 -113,-37" fill="none" stroke="#334155"/><polygon points="0,-60 57,-18 35,48 -35,48 -57,-18" fill="none" stroke="#334155"/><polygon points="0,-216 205,-63 119,164 -132,180 -198,-65" fill="url(#g)" opacity=".35" stroke="#67e8f9" stroke-width="3"/><g fill="#e2e8f0" font-size="18" text-anchor="middle"><text y="-250">AI / AGENTS 90</text><text x="255" y="-72">FULL-STACK 92</text><text x="160" y="214">DATA 88</text><text x="-160" y="214">3D / GAMES 90</text><text x="-255" y="-72">QA / TOOLING 86</text></g></g><g transform="translate(760 155)"><text font-size="18" font-weight="700" fill="#67e8f9">SCORE LEGEND</text><text y="36" fill="#cbd5e1" font-size="16">90–100 · high breadth / strong evidence</text><text y="68" fill="#cbd5e1" font-size="16">80–89 · advanced / repeatable capability</text><text y="100" fill="#cbd5e1" font-size="16">70–79 · solid signal / evidence can grow</text></g></g></svg>